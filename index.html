<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Víctor Ibáñez Campos</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #1b3a34;
            /* Fondo verde oscuro */
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            text-align: center;
        }

        .profile-pic {
            border-radius: 50%;
            width: 150px;
            height: 150px;
            object-fit: cover;
        }

        .linkedin-icon {
            margin-top: 10px;
        }

        .linkedin-icon img {
            width: 40px;
            height: 40px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="images/me.jpg" alt="Foto de perfil" class="profile-pic">
        <h1>Hola, soy Víctor Javier Ibáñez Campos.</h1>
        <div class="linkedin-icon">
            <a href="https://www.linkedin.com/in/victoribanezc/">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/81/LinkedIn_icon.svg" alt="LinkedIn">
            </a>
        </div>
        <div id="naas-box" style="margin-top: 2rem; font-style: italic;">
            <strong>No-as-a-Service dice:</strong>
            <div id="naas-reason">Cargando una buena excusa para decir que no…</div>
        </div>
    </div>

    <script>
        async function loadNoAsAServiceReason() {
            const container = document.getElementById('naas-reason');
            if (!container) return;

            container.textContent = 'Cargando una buena excusa para decir que no…';

            try {
                const response = await fetch('https://naas.isalman.dev/no');
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }

                const data = await response.json();

                if (data && data.reason) {
                    container.textContent = data.reason;
                } else {
                    container.textContent = 'La API respondió, pero sin una razón válida 😐';
                }
            } catch (error) {
                console.error('Error llamando a No-as-a-Service:', error);
                container.textContent = 'No pude hablar con la API de los “no”. Inténtalo de nuevo más tarde.';
            }
        }

        document.addEventListener('DOMContentLoaded', loadNoAsAServiceReason);
    </script>
</body>

</html>
